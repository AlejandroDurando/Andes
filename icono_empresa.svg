<svg viewBox="0 0 180 115" fill="none" xmlns="http://www.w3.org/2000/svg">
  <g stroke="#c8c8c8" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
    <!-- Ground line -->
    <line x1="8" y1="100" x2="158" y2="100"/>

    <!-- Left building -->
    <line x1="8"  y1="100" x2="8"  y2="68"/>
    <line x1="8"  y1="68"  x2="42" y2="50"/>
    <line x1="42" y1="50"  x2="60" y2="68"/>
    <line x1="60" y1="68"  x2="60" y2="100"/>
    <!-- Left windows -->
    <line x1="8"  y1="82"  x2="60" y2="82"/>
    <line x1="34" y1="68"  x2="34" y2="100"/>

    <!-- Centre building (taller) -->
    <line x1="60"  y1="100" x2="60"  y2="60"/>
    <line x1="60"  y1="60"  x2="95"  y2="38"/>
    <line x1="95"  y1="38"  x2="130" y2="60"/>
    <line x1="130" y1="60"  x2="130" y2="100"/>
    <!-- Centre windows/grid -->
    <line x1="60"  y1="80"  x2="130" y2="80"/>
    <line x1="60"  y1="60"  x2="130" y2="60"/>
    <line x1="82"  y1="60"  x2="82"  y2="100"/>
    <line x1="108" y1="60"  x2="108" y2="100"/>

    <!-- Right building -->
    <line x1="130" y1="100" x2="130" y2="68"/>
    <line x1="130" y1="68"  x2="146" y2="54"/>
    <line x1="146" y1="54"  x2="158" y2="68"/>
    <line x1="158" y1="68"  x2="158" y2="100"/>
    <!-- Right windows -->
    <line x1="130" y1="82"  x2="158" y2="82"/>
    <line x1="144" y1="68"  x2="144" y2="100"/>

    <!-- Chimney -->
    <line x1="150" y1="54" x2="150" y2="36"/>
    <line x1="147" y1="36" x2="153" y2="36"/>
    <!-- Smoke (wavy) -->
    <path d="M155,30 Q159,26 156,21" stroke-width="1.7"/>
    <path d="M159,34 Q163,30 160,25" stroke-width="1.7"/>

    <!-- Sol de Mayo in centre gable -->
    <circle cx="95" cy="70" r="9.5"/>
    <!-- Cardinal rays -->
    <line x1="95" y1="57.5" x2="95" y2="53"/>
    <line x1="95" y1="82.5" x2="95" y2="87"/>
    <line x1="82.5" y1="70" x2="78" y2="70"/>
    <line x1="107.5" y1="70" x2="112" y2="70"/>
    <!-- Diagonal rays -->
    <line x1="86.3" y1="61.3" x2="83"  y2="58"/>
    <line x1="103.7" y1="61.3" x2="107" y2="58"/>
    <line x1="86.3"  y1="78.7" x2="83"  y2="82"/>
    <line x1="103.7" y1="78.7" x2="107" y2="82"/>
    <!-- Wavy short rays -->
    <path d="M89,57 Q88,54 90,52"  stroke-width="1.5"/>
    <path d="M101,57 Q102,54 100,52" stroke-width="1.5"/>
    <path d="M89,83 Q88,86 90,88"  stroke-width="1.5"/>
    <path d="M101,83 Q102,86 100,88" stroke-width="1.5"/>
    <path d="M81,64 Q78,63 77,65"  stroke-width="1.5"/>
    <path d="M81,76 Q78,77 77,75"  stroke-width="1.5"/>
    <path d="M109,64 Q112,63 113,65" stroke-width="1.5"/>
    <path d="M109,76 Q112,77 113,75" stroke-width="1.5"/>
  </g>
</svg>
