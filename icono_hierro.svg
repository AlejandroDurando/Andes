<svg viewBox="0 0 160 95" fill="none" xmlns="http://www.w3.org/2000/svg">
  <g stroke="#c8c8c8" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top chord end caps -->
    <line x1="16" y1="15" x2="16" y2="26"/>
    <line x1="144" y1="15" x2="144" y2="26"/>
    <!-- Top chord -->
    <line x1="16" y1="20" x2="144" y2="20"/>
    <!-- Top nodes -->
    <circle cx="44" cy="20" r="3.5"/>
    <circle cx="72" cy="20" r="3.5"/>
    <circle cx="100" cy="20" r="3.5"/>
    <circle cx="122" cy="20" r="3.5"/>

    <!-- Mid chord end caps -->
    <line x1="6"   y1="44" x2="6"   y2="56"/>
    <line x1="154" y1="44" x2="154" y2="56"/>
    <!-- Mid chord -->
    <line x1="6" y1="50" x2="154" y2="50"/>
    <!-- Mid nodes -->
    <circle cx="6"   cy="50" r="3.5"/>
    <circle cx="44"  cy="50" r="3.5"/>
    <circle cx="72"  cy="50" r="3.5"/>
    <circle cx="100" cy="50" r="3.5"/>
    <circle cx="122" cy="50" r="3.5"/>
    <circle cx="154" cy="50" r="3.5"/>

    <!-- Bottom chord end caps -->
    <line x1="16"  y1="69" x2="16"  y2="79"/>
    <line x1="144" y1="69" x2="144" y2="79"/>
    <!-- Bottom chord -->
    <line x1="16" y1="75" x2="144" y2="75"/>
    <!-- Bottom nodes -->
    <circle cx="44"  cy="75" r="3.5"/>
    <circle cx="72"  cy="75" r="3.5"/>
    <circle cx="100" cy="75" r="3.5"/>
    <circle cx="122" cy="75" r="3.5"/>

    <!-- Upper diagonals: X-bracing all panels -->
    <line x1="16"  y1="20" x2="44"  y2="50"/>
    <line x1="44"  y1="20" x2="6"   y2="50"/>
    <line x1="44"  y1="20" x2="72"  y2="50"/>
    <line x1="72"  y1="20" x2="44"  y2="50"/>
    <line x1="72"  y1="20" x2="100" y2="50"/>
    <line x1="100" y1="20" x2="72"  y2="50"/>
    <line x1="100" y1="20" x2="122" y2="50"/>
    <line x1="122" y1="20" x2="100" y2="50"/>
    <line x1="122" y1="20" x2="154" y2="50"/>
    <line x1="144" y1="20" x2="122" y2="50"/>

    <!-- Lower diagonals: X/diamond bracing -->
    <line x1="6"   y1="50" x2="44"  y2="75"/>
    <line x1="44"  y1="50" x2="16"  y2="75"/>
    <line x1="44"  y1="50" x2="72"  y2="75"/>
    <line x1="72"  y1="50" x2="44"  y2="75"/>
    <line x1="72"  y1="50" x2="100" y2="75"/>
    <line x1="100" y1="50" x2="72"  y2="75"/>
    <line x1="100" y1="50" x2="122" y2="75"/>
    <line x1="122" y1="50" x2="100" y2="75"/>
    <line x1="122" y1="50" x2="144" y2="75"/>
    <line x1="154" y1="50" x2="122" y2="75"/>
  </g>
</svg>
